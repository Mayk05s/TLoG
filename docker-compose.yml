version: '3.8'

services:
  # ───────────────────────── Frontend ──────────────────
  frontend:
    container_name: tlog-frontend
    build:
      context: ./tlog-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:3000"
    networks:
      - data-layer_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ───────────────────────── Backend ──────────────────
  backend:
    container_name: tlog-backend
    build:
      context: ./tlog-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      DB_HOST: postgres
      REDIS_HOST: redis
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-layer_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ───────────────────────── PostgreSQL ──────────────────
  postgres:
    container_name: tlog-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - tlog_db_data:/var/lib/postgresql/data
    networks:
      - data-layer_default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────── Redis ──────────────────
  redis:
    container_name: tlog-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INSTANCE_ID=${INSTANCE_ID}
    ports:
      - "6379:6379"
    volumes:
      - tlog_redis_data:/data
    networks:
      - data-layer_default
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tlog_db_data:
  tlog_redis_data:

networks:
  data-layer_default:
    external: true
    name: data-layer_default
